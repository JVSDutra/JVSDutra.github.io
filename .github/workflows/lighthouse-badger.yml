# Adapted from the MIT-licensed Lighthouse Badger workflow by Sitdisch.
# Reports are stored as artifacts; no repository-write token is required.
name: Lighthouse reports

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit mobile and desktop
        run: |
          mkdir -p lighthouse-reports
          npx --yes lighthouse@13.6.0 https://jvsdutra.github.io/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=html --output=json --output-path=./lighthouse-reports/mobile
          npx --yes lighthouse@13.6.0 https://jvsdutra.github.io/ --chrome-flags="--headless --no-sandbox" --preset=desktop --only-categories=performance,accessibility,best-practices,seo --output=html --output=json --output-path=./lighthouse-reports/desktop
      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: error
